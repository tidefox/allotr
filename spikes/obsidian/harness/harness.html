<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fake obsidian</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; display: flex; flex-direction: column; height: 100vh;
    --background-modifier-border: #888; background: #fff; color: #222; }
  body.theme-dark { background: #1b1b1b; color: #ddd; }
  #ribbon { flex: none; display: flex; gap: 4px; padding: 4px; background: #ddd; }
  #workspace { flex: 1; min-height: 0; position: relative; }
  .workspace-leaf { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .view-content { flex: 1; min-height: 0; padding: var(--file-margins, 16px); box-sizing: border-box; }
  .modal-container { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--bg, #fff); color: #222; padding: 12px; max-width: 90vw; width: 640px; max-height: 90vh; overflow: auto; }
  .notice { position: fixed; right: 8px; bottom: 8px; background: #333; color: #fff; padding: 6px 10px; z-index: 200; }
</style>
</head>
<body class="theme-light">
<div id="ribbon"></div>
<div id="workspace"></div>
<script src="/fake-obsidian.js"></script>
</body>
</html>
